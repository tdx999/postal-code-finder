name: Keep Supabase Alive

on:
  schedule:
    # 每天 UTC 03:00（台灣時間 11:00）自動觸發
    - cron: '0 3 * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動按鈕觸發

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        env:
          TARGET_URL: ${{ secrets.VERCEL_PROJECT_URL }}
        run: |
          URL="${TARGET_URL:-https://postal-code-finder-lac.vercel.app}"
          # 去除結尾斜線並組合 db-health 端點
          CLEAN_URL="${URL%/}/api/db-health"
          echo "Pinging health endpoint: $CLEAN_URL"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CLEAN_URL" || echo "000")
          echo "Received HTTP status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase 保活連線成功 (HTTP 200)"
          else
            echo "⚠️ 回應狀態碼為 $HTTP_STATUS，請確認 Vercel 部署網址是否在 Repository Secrets 中設定為 VERCEL_PROJECT_URL"
          fi
